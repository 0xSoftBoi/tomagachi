# The whole shop: a GPU serving the base with every character adapter, and the
# billing layer in front of it.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   node deploy/preflight.mjs http://localhost:8080
#
# Adapters are prepared on the host first (`python3 deploy/vllm/prepare.py`)
# and mounted read-only, so a bad export can never be written back into a
# release the chain has already recorded.

services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command:
      - --model=${BASE_MODEL:-mistralai/Mistral-Small-24B-Instruct-2501}
      - --served-model-name=base
      - --dtype=bfloat16
      - --max-model-len=${MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization=0.90
      - --enable-lora
      - --max-loras=${MAX_LORAS:-5}
      - --max-lora-rank=16
      - --lora-modules=suwa-tide=/serving/suwa-tide
      - --lora-modules=suwa-abyss=/serving/suwa-abyss
      - --lora-modules=suwa-reef=/serving/suwa-reef
      - --lora-modules=suwa-drift=/serving/suwa-drift
      - --lora-modules=suwa-current=/serving/suwa-current
    environment:
      # Lets the creature hot-swap a new epoch in without dropping traffic.
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "True"
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ../serving:/serving:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s # a 24B model is slow to load the first time

  shop:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.shop
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      UPSTREAM_BASE_URL: http://vllm:8000/v1
      SERVE_PORT: "8080"
      SERVE_API_KEY: ${SERVE_API_KEY:-}
      SERVE_CONTEXT_LENGTH: ${MAX_MODEL_LEN:-32768}
      # Nothing is visible to a router until this is deliberately flipped.
      PROVIDER_IS_READY: ${PROVIDER_IS_READY:-0}
      PROVIDER_SLUG: ${PROVIDER_SLUG:-suwappu}
      DATACENTERS: ${DATACENTERS:-US:us-east-1}
      GPU_USD_PER_HOUR: ${GPU_USD_PER_HOUR:-2}
      GPU_COUNT: "1"
    volumes:
      - shop-state:/app/agent/state # the revenue ledger outlives the container
      - ../model:/app/model:ro      # the catalog: one definition per SKU
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hf-cache:
  shop-state:
